<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon TCG Simulator | 3D Pack Tear Arena & Collection Binders</title>
    <meta name="description" content="Experience 3D foil tearing, collection binders, PSA grading, and virtual card show trading on the Pokémon TCG Simulator." />
    <meta name="theme-color" content="#14141c" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #090a10;
        color: #ffffff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      #root {
        height: 100%;
      }
      .app-initial-splash {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100vh;
        background: radial-gradient(circle at center, #181928 0%, #090a10 100%);
        user-select: none;
      }
      .splash-box-icon {
        width: 68px;
        height: 68px;
        border-radius: 20px;
        background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        box-shadow: 0 0 35px rgba(245, 158, 11, 0.45);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 22px;
        animation: splash-pulse 1.8s infinite ease-in-out;
      }
      .splash-title {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
        text-transform: uppercase;
        background: linear-gradient(to right, #fef3c7, #f59e0b, #fbbf24);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .splash-subtitle {
        font-size: 13px;
        color: #9ca3af;
        font-weight: 600;
        margin-bottom: 26px;
        letter-spacing: 0.02em;
      }
      .splash-bar-bg {
        width: 220px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar-fill {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #fbbf24, transparent);
        animation: splash-shimmer 1.3s infinite ease-in-out;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(245, 158, 11, 0.35); }
        50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(245, 158, 11, 0.65); }
      }
      @keyframes splash-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <link rel="preload" href="/sleeve.png" as="image" />
  </head>
  <body>
    <div id="root">
      <div class="app-initial-splash">
        <div class="splash-box-icon">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m16.5 9.4-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
        </div>
        <div class="splash-title">Pokemon TCG Simulator</div>
        <div class="splash-subtitle">Initializing booster packs & market prices...</div>
        <div class="splash-bar-bg">
          <div class="splash-bar-fill"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
